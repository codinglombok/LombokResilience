[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lombokresilience"
version = "0.1.0"
description = "Small resilience primitives with explicit time: EWMA latency tracking, circuit breaker, exponential backoff with jitter, and health-aware candidate ranking. Part of the Lombok Ecosystem."
license = "Apache-2.0 OR MIT"
readme = "README.md"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/lombokresilience"]
